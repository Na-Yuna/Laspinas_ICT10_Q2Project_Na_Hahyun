
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tab Title -->
    <title>Student Showcase</title>

    <!-- Favicon (Cloud Emoji) -->
    <link rel="icon" href="data:image/svg+xml,*<*&#x73;vg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>*<*&#x74;ext y=%22.9em%22 font-size=%2290%22>☁&#xFE0F;*<*/text>*<*/svg>">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* Body */
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 20px 70px;
            box-sizing: border-box;
            background: #000000;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        /* Main Menu */
        .menu {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 500px;

            margin: auto;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        /* Cloud Logo */
        .cloud-logo {
            font-size: 100px;
            line-height: 1;
            margin-bottom: 5px;
            color: white;
            filter: drop-shadow(0 3px 12px rgba(255, 255, 255, 0.25));
        }

        /* Student Showcase */
        .menu h1 {
            font-size: 48px;
            font-weight: 800;
            color: white;
            margin-bottom: 12px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
        }

        /* Name */
        .menu h2 {
            font-size: 21px;
            font-weight: 700;
            color: #dceaff;
            margin-bottom: 20px;
        }

        /* Menu Button */
        .menu-button {
            display: block;
            width: 190px;
            box-sizing: border-box;

            margin: 10px auto;
            padding: 13px;

            border: none;
            border-radius: 50px;

            background-color: #ffffff;
            color: #5b6169;

            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;

            text-align: center;
            text-decoration: none;

            cursor: pointer;
            transition: all 0.25s ease;
        }

        /* Button Hover */
        .menu-button:hover {
            background-color: #5b6169;
            color: white;
            transform: translateY(-3px);
        }

        /* Button Focus */
        .menu-button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        /* Footer */
        footer {
            position: fixed;
            z-index: 2;

            bottom: 0;
            left: 0;
            width: 100%;

            font-family: 'Nunito', sans-serif;
            text-align: center;
            color: #696b6e;

            padding: 10px;
            background-color: rgba(255, 255, 255, 0.741);
        }

        /* Footer Text */
        footer p {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
        }

        /* Smaller Screens */
        @media (max-width: 576px) {

            .menu h1 {
                font-size: 38px;
            }

            .menu h2 {
                font-size: 21px;
            }

            .cloud-logo {
                font-size: 100px;
            }

        }

        /* Very Short Screens */
        @media (max-height: 600px) {

            body {
                justify-content: flex-start;
            }

            .menu {
                margin-top: 25px;
                margin-bottom: 25px;
            }

        }

    </style>
</head>

<body>

    <!-- Video Background -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="Pretty bg.mp4" type="video/mp4">
    </video>

    <!-- Main Menu -->
    <div class="menu">

        <!-- Cloud Logo -->
        <div class="cloud-logo">
            ☁️
        </div>

        <h1>Student Showcase</h1>

        <h2>Na Hahyun</h2>

        <a class="menu-button" href="Homepage.html">
            START
        </a>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 ICT - Project - 2nd Quarter</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Python -->
    <script type="py" src="main.py"></script>

</body>
</html>
